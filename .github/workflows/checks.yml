name: Tests and study-streak notebook
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: '1'
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m streak_lab.execute_notebook
      - uses: actions/upload-artifact@v4
        with:
          name: study-streak-${{ matrix.os }}
          path: |
            outputs/
            notebooks/executed/
          retention-days: 14


